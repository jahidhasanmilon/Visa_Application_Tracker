<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F3FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121022" media="(prefers-color-scheme: dark)" />
    <title>VisaTrack</title>
    <meta name="description" content="Your Germany visa journey, tracked every step of the way." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VisaTrack" />
    <meta property="og:title" content="VisaTrack" />
    <meta property="og:description" content="Your Germany visa journey, tracked every step of the way." />
    <meta property="og:url" content="https://visatrack24.vercel.app/" />
    <meta property="og:image" content="https://visatrack24.vercel.app/favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VisaTrack" />
    <meta name="twitter:description" content="Your Germany visa journey, tracked every step of the way." />
    <meta name="twitter:image" content="https://visatrack24.vercel.app/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('visa-tracker-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
